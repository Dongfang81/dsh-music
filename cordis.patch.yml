# dsh-music 组合包补丁：把内置音乐播放插件行插入 profile。
# 用户可在自己 profile 的 cordis.patch.yml 里按 id 覆盖整个 config（见 README）。
- insert:
    - id: alger-music
      name: '@dongfang81/dsh-music'
      config:
        # 内置音乐 API 服务（开源网易云音乐 API）监听端口，仅本机回环
        musicApiPort: 30588
        # 监听地址（保持 127.0.0.1，不暴露到局域网）
        musicApiHost: '127.0.0.1'
        # 单次 HTTP/命令操作超时（毫秒）
        timeoutMs: 20000
        # 可选：仅扫描这里明确列出的本地音乐绝对路径；默认不读取任何目录
        localMusicPaths: []
        # 是否根据本地播放反馈更新推荐偏好
        recommendationLearning: true
        # 点击“推荐”时计划插入的歌曲数
        recommendationTargetSize: 15
